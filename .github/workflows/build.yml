name: Construire l'APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construire l'interface web
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk LauncherScania.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LauncherScania-apk
          path: LauncherScania.apk

      - name: Publier une release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LauncherScania.apk

      # Chaque push sur la branche de travail publie la dernière version en lien direct :
      # https://github.com/Casanovaa83136/LAUNCHER-SCANIA/releases/latest/download/LauncherScania.apk
      - name: Publier la dernière version
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/bold-keller-ymtuo1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Launcher Scania 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK à installer sur l'autoradio (ou sur un téléphone pour tester).
          files: LauncherScania.apk
